<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>man clothes</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="brand">
                <span class="brand-logo"></span>
                <span class="brand-name">man clothes</span>
            </a>

            <nav class="main-nav">
                <a href="#contact">Contact</a>
            </nav>

            <div class="header-actions">

                <button type="button" class="language-btn" aria-label="Language">
                    AR
                </button>

                <button type="button" class="theme-btn" aria-label="Theme">
                    ◐
                </button>

            </div>

        </div>
    </header>

<main id="app">

<section class="hero">
    <div class="container hero-inner">

        <div class="hero-content">
            <p class="hero-eyebrow">man clothes</p>

            <h1>How to dress like a gentleman</h1>

            <p class="hero-text">
                Discover your style.
            </p>

            <a href="products.html" class="hero-cta">
                اطلب الآن
            </a>
        </div>

    </div>
</section>
<section class="products-preview">
    <div class="container">

        <div class="section-heading">
            <p class="section-eyebrow">Products</p>
            <h2>Latest products</h2>
        </div>

        <div class="products-grid" id="home-products">
            <!-- Products will be loaded from Supabase -->
        </div>

    </div>
</section>
</main>

<footer class="site-footer">
    <div class="container footer-inner">

        <span class="footer-brand">man clothes</span>

        <a href="#contact">Contact</a>

        <span class="footer-copy">© man clothes</span>

    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>

</body>
</html>
